<div id="yumiro-smooth-review" data-appearance="light">
 <div class="viz-controls" aria-label="Smooth panel preview settings">
  <div class="viz-row" role="group" aria-label="Appearance">
   <button type="button" class="btn cursor-interaction" data-theme="light" aria-pressed="true">Light</button>
   <button type="button" class="btn cursor-interaction" data-theme="dark" aria-pressed="false">Dark</button>
  </div>
  <label class="form-label">Smooth state
   <select class="form-select" aria-label="Smooth panel state">
    <option value="default">Default · 30</option>
    <option value="adjusted">Adjusted</option>
    <option value="disabled">Disabled · processing</option>
   </select>
  </label>
 </div>
 <div class="viz-carousel viz-dotted-background" aria-label="Yumiro Smooth panel directions">
  <section data-variant="Quiet row" aria-label="Quiet row Smooth panel direction">
   <div class="ys-stage"><div class="ys-phone" data-direction="quiet"></div></div>
  </section>
  <section data-variant="Soft card" aria-label="Soft card Smooth panel direction" hidden>
   <div class="ys-stage"><div class="ys-phone" data-direction="card"></div></div>
  </section>
 </div>
 <div class="text-small" data-feedback aria-live="polite">Default strength 30 · Reset returns to 0.</div>
</div>
<style>
#yumiro-smooth-review .ys-stage {display:flex;justify-content:center;padding:20px 8px 14px;min-height:880px;box-sizing:border-box}
#yumiro-smooth-review .ys-phone {--ys-bg:light-dark(#fff,#000);--ys-canvas:light-dark(#f2f2f7,#1c1c1e);--ys-text:light-dark(#171719,#f5f5f7);--ys-muted:light-dark(#696971,#a1a1aa);--ys-disabled:light-dark(#b6b6be,#55555d);--ys-line:light-dark(#d9d9de,#38383a);--ys-accent:light-dark(#007aff,#0a84ff);--ys-soft:light-dark(#e9f3ff,#092b4c);--ys-ink:light-dark(#0064cc,#6bb5ff);--ys-control-bg:light-dark(#f8f8fa,#242426);width:390px;max-width:100%;height:844px;display:flex;flex-direction:column;background:var(--ys-bg);color:var(--ys-text);border:1px solid var(--ys-line);border-radius:38px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 10px 36px #00000014;box-sizing:border-box}
#yumiro-smooth-review[data-appearance="light"] .ys-phone {color-scheme:light}
#yumiro-smooth-review[data-appearance="dark"] .ys-phone {color-scheme:dark}
#yumiro-smooth-review .ys-phone * {box-sizing:border-box}
#yumiro-smooth-review .ys-status {height:59px;flex-shrink:0;padding:15px 26px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:14px;font-weight:600;position:relative}
#yumiro-smooth-review .ys-island {position:absolute;top:10px;left:50%;transform:translateX(-50%);width:116px;height:31px;border-radius:24px;background:#000}
#yumiro-smooth-review .ys-status-icons {display:flex;gap:5px;align-items:center}
#yumiro-smooth-review .ys-status-icons svg {width:15px;height:15px}
#yumiro-smooth-review .ys-top {height:52px;flex-shrink:0;display:flex;align-items:center;position:relative;padding:4px 12px;gap:8px}
#yumiro-smooth-review .ys-top-control {display:flex;align-items:center;justify-content:center;flex-shrink:0;width:44px;height:44px;border-radius:14px;background:var(--ys-canvas);color:var(--ys-accent)}
#yumiro-smooth-review .ys-top-control svg {width:20px;height:20px;stroke-width:1.8}
#yumiro-smooth-review .ys-top .ys-close {color:var(--ys-muted)}
#yumiro-smooth-review .ys-top .ys-disabled {color:var(--ys-disabled)}
#yumiro-smooth-review .ys-history {position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px}
#yumiro-smooth-review .ys-top .ys-save {width:76px;background:var(--ys-accent);color:#fff;margin-left:auto;font-size:17px;font-weight:600}
#yumiro-smooth-review .ys-canvas {height:449px;flex-shrink:0;position:relative;background:var(--ys-canvas);overflow:hidden;display:flex;align-items:center;justify-content:center}
#yumiro-smooth-review .ys-photo {width:100%;height:100%;object-fit:contain;user-select:none}
#yumiro-smooth-review .ys-compare {position:absolute;bottom:12px;left:12px;width:44px;height:44px;display:grid;place-items:center;border:1px solid light-dark(#00000016,#ffffff24);border-radius:14px;background:light-dark(#f8f8faef,#242426ef);color:var(--ys-text);backdrop-filter:blur(14px);box-shadow:0 1px 4px #00000016}
#yumiro-smooth-review .ys-compare svg {width:20px;height:20px;stroke-width:1.8}
#yumiro-smooth-review .ys-panel {height:184px;flex-shrink:0;padding:12px 16px;display:flex;align-items:stretch;justify-content:center;flex-direction:column}
#yumiro-smooth-review .ys-adjustment {--ys-adjust-radius:14px;display:flex;flex-direction:column;gap:8px}
#yumiro-smooth-review .ys-heading {display:flex;align-items:center;min-height:44px;gap:8px}
#yumiro-smooth-review .ys-heading label {font-size:15px;font-weight:500;margin-right:auto}
#yumiro-smooth-review .ys-value {font-size:15px;line-height:20px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;min-width:44px;min-height:32px;padding:4px 8px;border-radius:10px;background:var(--ys-soft);color:var(--ys-ink)}
#yumiro-smooth-review .ys-reset {flex-shrink:0;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:var(--ys-adjust-radius);background:var(--ys-canvas);color:var(--ys-ink);padding:0;cursor:inherit}
#yumiro-smooth-review .ys-reset svg {width:20px;height:20px;stroke-width:1.8}
#yumiro-smooth-review .ys-reset:disabled {color:var(--ys-disabled)}
#yumiro-smooth-review .ys-range {--ys-progress:30%;--ys-range-fill:var(--ys-accent);width:100%;min-width:0;height:44px;padding:0;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:inherit;border-radius:3px}
#yumiro-smooth-review .ys-range::-webkit-slider-runnable-track {height:4px;border-radius:3px;background:linear-gradient(to right,var(--ys-range-fill) 0 var(--ys-progress),var(--ys-line) var(--ys-progress) 100%)}
#yumiro-smooth-review .ys-range::-webkit-slider-thumb {appearance:none;-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0003}
#yumiro-smooth-review .ys-range::-moz-range-track {height:4px;border-radius:3px;background:linear-gradient(to right,var(--ys-range-fill) 0 var(--ys-progress),var(--ys-line) var(--ys-progress) 100%)}
#yumiro-smooth-review .ys-range::-moz-range-thumb {width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0003}
#yumiro-smooth-review .ys-range:disabled {--ys-range-fill:var(--ys-disabled)}
#yumiro-smooth-review .ys-range:disabled::-webkit-slider-thumb {background:var(--ys-line);box-shadow:none}
#yumiro-smooth-review .ys-range:disabled::-moz-range-thumb {background:var(--ys-line);box-shadow:none}
#yumiro-smooth-review .ys-helper {font-size:13px;color:var(--ys-muted);line-height:18px;min-height:18px;margin:0}
#yumiro-smooth-review .ys-slider-line {display:flex;align-items:center;gap:12px}
#yumiro-smooth-review .ys-phone[data-direction="card"] .ys-adjustment {background:var(--ys-canvas);border-radius:var(--ys-adjust-radius);padding:12px;gap:8px}
#yumiro-smooth-review .ys-phone[data-direction="card"] .ys-heading {min-height:32px}
#yumiro-smooth-review .ys-phone[data-direction="card"] .ys-value {font-size:22px;line-height:28px;background:transparent;padding:0;color:var(--ys-text)}
#yumiro-smooth-review .ys-phone[data-direction="card"] .ys-reset {background:var(--ys-bg)}
#yumiro-smooth-review .ys-adjustment[data-disabled="true"] .ys-heading label {color:var(--ys-muted)}
#yumiro-smooth-review .ys-adjustment[data-disabled="true"] .ys-value {background:transparent;color:var(--ys-muted)}
#yumiro-smooth-review .ys-value[data-zero="true"] {background:var(--ys-canvas);color:var(--ys-muted)}
#yumiro-smooth-review .ys-bottom {height:66px;flex-shrink:0;border-top:1px solid var(--ys-line)}
#yumiro-smooth-review .ys-rail {height:65px;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;padding:3px 8px}
#yumiro-smooth-review .ys-rail::-webkit-scrollbar {display:none}
#yumiro-smooth-review .ys-tool {position:relative;min-width:66px;height:58px;padding:5px 6px 4px;border-radius:14px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--ys-muted)}
#yumiro-smooth-review .ys-tool svg {width:22px;height:22px;stroke-width:1.7}
#yumiro-smooth-review .ys-tool-label {font-size:11px;line-height:14px;white-space:nowrap}
#yumiro-smooth-review .ys-tool[data-selected] {background:var(--ys-soft);color:var(--ys-accent)}
#yumiro-smooth-review .ys-tool[data-selected] .ys-tool-label {font-weight:600}
#yumiro-smooth-review .ys-tool[data-selected]::after {content:"";position:absolute;bottom:3px;width:14px;height:2px;border-radius:3px;background:var(--ys-accent)}
#yumiro-smooth-review .ys-tool[data-changed]::before {content:"";position:absolute;width:6px;height:6px;top:5px;left:calc(50% + 13px);border-radius:50%;background:var(--ys-muted)}
#yumiro-smooth-review .ys-group-divider {width:1px;height:24px;background:var(--ys-line);flex-shrink:0;margin:0 5px}
#yumiro-smooth-review .ys-home {height:34px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;background:var(--ys-bg)}
#yumiro-smooth-review .ys-home::before {content:"";height:5px;width:134px;border-radius:3px;background:var(--ys-text)}
@media(max-width:400px){#yumiro-smooth-review .ys-stage{padding-left:0;padding-right:0}}
</style>
<script>
(() => {
 const root=document.getElementById('yumiro-smooth-review');
 const saved=globalThis.openai?.widgetState?.privateContent || {};
 const state={theme:saved.theme==='dark' ? 'dark' : 'light',mode:['default','adjusted','disabled'].includes(saved.mode) ? saved.mode : 'default',value:typeof saved.value==='number' && saved.value>=0 && saved.value<=1 ? saved.value : 0.3};
 const select=root.querySelector('select');
 const feedback=root.querySelector('[data-feedback]');
 const names=['Enhance','Adjust','Smooth','Retouch','Face','Warp','Heal','Background'];
 const icons=['sparkles','sliders-horizontal','droplet','wand-sparkles','smile','hand','bandage','scan-line'];
 const groups=[[0,1],[2,3,4,5],[6,7]];
 const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const tool=i=>`<span class="ys-tool" ${i===2 ? 'data-selected' : ''} ${i===1 ? 'data-changed' : ''} aria-label="${names[i]}${i===2 ? ', selected' : ''}${i===1 ? ', changed' : ''}">${icon(icons[i])}<span class="ys-tool-label">${names[i]}</span></span>`;
 root.querySelectorAll('.ys-phone').forEach(phone=>{
  const card=phone.dataset.direction==='card';
  const key=phone.dataset.direction;
  const reset=`<button type="button" class="ys-reset cursor-interaction" data-reset aria-label="Reset Smooth skin to zero">${icon('rotate-ccw')}</button>`;
  const range=`<input class="ys-range cursor-interaction" id="ys-strength-${key}" type="range" min="0" max="1" step="any" value="0.3" aria-label="Smooth skin strength" aria-describedby="ys-helper-${key}">`;
  const helper=`<p class="ys-helper" id="ys-helper-${key}" data-helper>Edges, eyes and lips stay sharp</p>`;
  phone.innerHTML=`<div class="ys-status" aria-hidden="true"><span>9:41</span><span class="ys-island"></span><span class="ys-status-icons">${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div>
   <div class="ys-top" aria-label="Existing Balanced top bar, held fixed"><span class="ys-top-control ys-close">${icon('x')}</span><div class="ys-history"><span class="ys-top-control">${icon('undo-2')}</span><span class="ys-top-control ys-disabled">${icon('redo-2')}</span></div><span class="ys-top-control ys-save">Save</span></div>
   <div class="ys-canvas" aria-label="Existing photo canvas and Soft controls, held fixed"><img class="ys-photo" draggable="false" src="https://cdn.jsdelivr.net/gh/scikit-image/scikit-image@v0.19.3/skimage/data/astronaut.png" alt="Sample portrait of astronaut Eileen Collins, NASA"><span class="ys-compare" aria-label="Existing Compare control">${icon('columns-2')}</span></div>
   <section class="ys-panel" aria-label="${card ? 'Soft card' : 'Quiet row'} Smooth panel"><div class="ys-adjustment" data-adjustment><div class="ys-heading"><label for="ys-strength-${key}">Smooth skin</label><output class="ys-value" for="ys-strength-${key}" data-value>30</output>${card ? '' : reset}</div>${card ? helper : ''}<div class="ys-slider-line">${range}${card ? reset : ''}</div>${card ? '' : helper}</div></section>
   <div class="ys-bottom" aria-label="Existing Focus rail, held fixed"><div class="ys-rail">${groups.map(group=>group.map(tool).join('')).join('<span class="ys-group-divider" aria-hidden="true"></span>')}</div></div><div class="ys-home" aria-hidden="true"></div>`;
  phone.querySelector('.ys-range').addEventListener('input',event=>{if(state.mode==='disabled')return;state.value=Number(event.target.value);state.mode='adjusted';render();});
  phone.querySelector('.ys-range').addEventListener('change',persist);
  phone.querySelector('[data-reset]').addEventListener('click',()=>{if(state.mode==='disabled')return;state.value=0;state.mode='adjusted';render();persist();});
  if(globalThis.Tweak){const shape={radius:14};const adjustment=phone.querySelector('[data-adjustment]');const tweak=new Tweak({container:adjustment,onChange:()=>adjustment.style.setProperty('--ys-adjust-radius',shape.radius+'px')});tweak.addSlider(shape,'radius',{label:'Panel control radius',min:10,max:20,unit:'px'});}
 });
 function render(){
  const disabled=state.mode==='disabled';
  const value=Math.round(state.value*100);
  root.dataset.appearance=state.theme;
  root.querySelectorAll('[data-theme]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.theme===state.theme));
  root.querySelectorAll('[data-adjustment]').forEach(panel=>panel.dataset.disabled=String(disabled));
  root.querySelectorAll('.ys-range').forEach(range=>{range.value=String(state.value);range.disabled=disabled;range.setAttribute('aria-valuetext',value+' out of 100');range.style.setProperty('--ys-progress',state.value*100+'%');});
  root.querySelectorAll('[data-value]').forEach(output=>{output.textContent=String(value);output.dataset.zero=String(state.value<0.001);});
  root.querySelectorAll('[data-reset]').forEach(button=>button.disabled=disabled || state.value<0.001);
  root.querySelectorAll('[data-helper]').forEach(helper=>helper.textContent=disabled ? 'Available when processing finishes' : 'Edges, eyes and lips stay sharp');
  select.value=state.mode;
  feedback.textContent=disabled ? 'Disabled during processing · current strength retained.' : state.mode==='default' ? 'Default strength 30 · Reset returns to 0.' : 'Strength '+value+' · Reset returns to 0. Photo preview remains fixed.';
 }
 function persist(){if(globalThis.openai?.setWidgetState)globalThis.openai.setWidgetState({modelContent:null,privateContent:{theme:state.theme,mode:state.mode,value:state.value}}).catch(()=>{});}
 root.querySelectorAll('[data-theme]').forEach(button=>button.addEventListener('click',()=>{state.theme=button.dataset.theme;render();persist();}));
 select.addEventListener('change',()=>{state.mode=select.value;if(state.mode==='default')state.value=0.3;if(state.mode==='adjusted')state.value=0.65;render();persist();});
 render();
 if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});
})();
</script>
